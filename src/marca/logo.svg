<!-- Logo de Caudal: dos olas que avanzan sobre el degradado lima de la tarjeta principal; el punto es la plata que llega.
     Fuente de los íconos PNG (python3 src/marca/iconos.py). El mismo trazo, en pequeño, es la marca dentro de la app. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lima" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#79CF5C"/><stop offset=".45" stop-color="#B6EE4A"/><stop offset="1" stop-color="#E2FA7C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#lima)"/>
  <g fill="none" stroke="#0F1114" stroke-width="8.5" stroke-linecap="round">
    <path d="M20 41c7.5-8 15-8 22.5 0s15 8 22.5 0"/>
    <path d="M20 60c7.5-8 15-8 22.5 0s15 8 22.5 0"/>
  </g>
  <circle cx="79" cy="60" r="5.5" fill="#0F1114"/>
</svg>
