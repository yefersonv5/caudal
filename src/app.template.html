}
/* selector de categoría estilo cuadrícula: la principal abre sus subcategorías debajo de su fila.
   k: prefijo de los data-* ('f' en el formulario, 'rv' + índice en la revisión de IA) */
function gridPicker(type, parent, sub, open, expand, k){
  const at = (n, v) => 'data-' + n + '="' + esc(v) + '" data-k="' + k + '"';
  const pc = parent ? cat(parent) : null, sc = sub ? cat(sub) : null;
  if (pc && !open) return '<button type="button" class="csel" ' + at('gopen', '1') + '><span class="em">' + esc((sc && sc.emoji) || pc.emoji || '•') + '</span><b>' + esc(pc.name + (sc ? ' › ' + sc.name : '')) + '</b><span class="ch">Cambiar</span></button>';
  const parents = S.categories.filter(c => !c.parentId && c.type === type && (!c.hidden || c.id === parent));
  const subsOf = id => S.categories.filter(c => c.parentId === id && (!c.hidden || c.id === sub));
  const tile = (c, attrs, pressed, extra, chev) => '<button type="button" class="ctile" ' + attrs + ' aria-pressed="' + pressed + '"' + (extra || '') + '><span class="em">' + esc(c.emoji || '•') + '</span><span class="nm">' + esc(c.name) + '</span>' + (chev ? '<span class="chev">' + (expand === c.id ? '▲' : '▼') + '</span>' : '') + '</button>';
  const ix = parents.findIndex(c => c.id === expand), end = ix < 0 ? -1 : Math.min(parents.length - 1, ix - ix % 3 + 2);
  let h = '<div class="cgrid">';
  parents.forEach((c, i) => { const hs = subsOf(c.id).length > 0;
    h += tile(c, at('gp', c.id), parent === c.id && !hs, hs ? ' aria-expanded="' + (expand === c.id) + '"' : '', hs);
    if (i === end) { const p0 = parents[ix];
      h += '<div class="csubs">' + tile({ emoji:p0.emoji, name:'Solo ' + p0.name }, at('gsel', p0.id), parent === p0.id && !sub) +
        subsOf(p0.id).map(s => tile(s, at('gs', s.id), sub === s.id)).join('') + '</div>'; }
  });
  return h + '</div>';
}
function catPicker(){ return gridPicker(F.type, F.parent, F.sub, F.catOpen || !F.parent, F.expand, 'f'); }
/* aplica un toque de la cuadrícula a un estado { parent, sub, open, expand } */
function gridTap(st, d){
  if (d.gp) { if (S.categories.some(c => c.parentId === d.gp && !c.hidden)) { st.expand = st.expand === d.gp ? null : d.gp; return; } st.parent = d.gp; st.sub = null; st.open = false; st.expand = null; return; }
  if (d.gsel) { st.parent = d.gsel; st.sub = null; st.open = false; st.expand = null; return; }
  if (d.gs) { st.sub = d.gs; st.parent = (cat(d.gs) || {}).parentId || st.parent; st.open = false; st.expand = null; return; }
  if (d.gopen) { st.open = true; st.expand = st.parent; }
}
function readAmt(){ return parseInt(($('#f-amt').value || '').replace(/\D/g, ''), 10) || 0; }
function syncForm(){ const a = $('#f-amt'); if (!a) return; const v = readAmt(); F.amount = F.type === 'ajuste' && F.amount < 0 ? -v : v; F.date = $('#f-date').value || F.date; F.note = $('#f-note').value; }
function submitForm(){
  syncForm();
  const err = m => { $('#f-err').textContent = m; };
  if (!F.amount) return err('Escribe el valor.');
  if ((F.type === 'gasto' || F.type === 'ingreso') && !F.parent) return err('Elige una categoría.');
  if (!F.accountId) return err('Elige una cuenta.');
  if (F.type === 'transferencia' && (!F.toAccountId || F.toAccountId === F.accountId)) return err('Elige una cuenta de destino distinta.');
  const t = { id: F.id || uid(), type:F.type, amount: F.type === 'ajuste' ? F.amount : Math.abs(F.amount), date:F.date, ts:Date.now(), accountId:F.accountId, note:F.note.trim() };
  if (F.type === 'gasto' || F.type === 'ingreso') t.categoryId = F.sub || F.parent;
  if (F.type === 'transferencia') t.toAccountId = F.toAccountId;
  const i = S.transactions.findIndex(x => x.id === t.id);
  if (i >= 0) { t.ts = S.transactions[i].ts || t.ts; S.transactions[i] = t; } else S.transactions.push(t);
  S.lastAccount = F.accountId; sortTx(S); save();
  const wasEdit = !!F.id; closeSheet();
  const p = period(ui.offset); if (!inP(t, p)) { for (let o = -24; o <= 1; o++) { if (inP(t, period(o))) { ui.offset = o; break; } } }
  render(); { const bm = budgetMsg(t); toast(bm || (wasEdit ? 'Cambios guardados' : 'Registrado'), bm ? 3400 : 2000); }
}

function accForm(){
  openSheet('<div class="sheet-h"><b id="sheet-title">Nueva cuenta</b><button class="x" data-close aria-label="Cerrar">✕</button></div><form class="form" id="accf" novalidate>' +
    '<div class="field"><label class="label" for="a-name">Nombre</label><input class="inp" id="a-name" placeholder="Ej. Nequi" autocomplete="off"></div>' +
    '<div class="field"><label class="label" for="a-group">Grupo</label><input class="inp" id="a-group" list="grps" placeholder="Ej. Cuenta bancaria" autocomplete="off"><datalist id="grps">' + [...new Set(S.accounts.map(a => a.group))].map(g => '<option value="' + esc(g) + '">').join('') + '</datalist></div>' +
    '<div class="field"><label class="label" for="a-bal">Saldo actual</label><input class="inp num" id="a-bal" inputmode="numeric" placeholder="0"></div><div class="err" id="a-err"></div>' +
    '<button class="btn accent block" type="submit">Crear cuenta</button></form>');
}
function catForm(){
  const parents = S.categories.filter(c => !c.parentId && !c.hidden);
  openSheet('<div class="sheet-h"><b id="sheet-title">Nueva categoría</b><button class="x" data-close aria-label="Cerrar">✕</button></div><form class="form" id="catf" novalidate>' +
    '<div class="two"><div class="field"><label class="label" for="c-emoji">Emoji</label><input class="inp" id="c-emoji" maxlength="4" placeholder="🍕"></div><div class="field"><label class="label" for="c-name">Nombre</label><input class="inp" id="c-name" autocomplete="off" placeholder="Ej. Domicilios"></div></div>' +
    '<div class="field"><label class="label" for="c-parent">Dentro de</label><select class="inp" id="c-parent"><option value="">Ninguna (categoría principal de gasto)</option><option value="__inc">Ninguna (categoría principal de ingreso)</option>' + parents.map(c => '<option value="' + esc(c.id) + '">' + esc(c.emoji + ' ' + c.name) + '</option>').join('') + '</select></div><div class="err" id="c-err"></div>' +
    '<button class="btn accent block" type="submit">Crear categoría</button></form>');
}

/* ---------- importación ---------- */
let sqlReady = null;
function loadSql(){
  if (sqlReady) return sqlReady;
  const srcs = ['https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js', 'https://unpkg.com/sql.js@1.10.3/dist/sql-asm.js'];
  sqlReady = new Promise((res, rej) => {
    const tryLoad = i => { if (i >= srcs.length) return rej(new Error('No se pudo cargar el lector de respaldos.'));
      const s = document.createElement('script'); s.src = srcs[i]; s.onload = () => window.initSqlJs().then(res, rej); s.onerror = () => tryLoad(i + 1); document.head.appendChild(s); };
    tryLoad(0);
  });
  sqlReady.catch(() => { sqlReady = null; });
  return sqlReady;
}
async function importMM(file){
  const msg = $('#impmsg'); msg.textContent = 'Leyendo ' + file.name + '…';
  try {
    const SQL = await loadSql();
    const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
    const st = mmImport(db); db.close();
    if (!st.transactions.length && !st.accounts.length) throw new Error('El archivo no tiene movimientos.');
    const keep = S.demo ? {} : { bills:S.bills, recurring:S.recurring, cardMap:S.cardMap, plans:S.plans };
    const nm = S.settings && S.settings.name, rt = S.settings && S.settings.rate;
    S = st; S.plans = keep.plans || []; S.bills = keep.bills || []; S.recurring = keep.recurring || []; S.cardMap = keep.cardMap || {}; S.inbox = [];
    if (nm) S.settings.name = nm; if (rt) S.settings.rate = rt; save(); ui.offset = 0; ui.accFilter = null; ui.view = 'inicio'; render();
    toast(nf.format(st.transactions.length) + ' movimientos importados');
  } catch(e){ msg.textContent = 'No pude leer ese archivo. Verifica que sea el respaldo .mmbak de Money Manager. (' + e.message + ')'; }
}
async function importJSON(file){
  try { const s = JSON.parse(await file.text()); if (!s.transactions || !s.accounts || !s.categories) throw new Error('formato');
    S = s; save(); ui.view = 'inicio'; ui.offset = 0; render(); toast('Respaldo restaurado'); }
  catch(e){ $('#impmsg').textContent = 'Ese archivo no es un respaldo de Caudal.'; }
}

/* ---------- eventos ---------- */
let toastT;
function toast(m, ms){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 2000); }
function go(v){ ui.view = v; ui.resetArm = false; render(); window.scrollTo({ top:0 }); }

document.addEventListener('click', e => {
  const el = e.target.closest('button,[data-close]'); if (!el) return;
  const d = el.dataset;
  if ((el.closest('.nav-in') || el.classList.contains('gear')) && d.v) return go(d.v);
  if (el.id === 'fab' || d.add !== undefined) return txForm(null);
  if (el.id === 'prev') { ui.offset--; return render(); }
  if (el.id === 'next') { ui.offset++; return render(); }
  if (d.go) return go(d.go);
  if (d.tx) { const t = S.transactions.find(x => x.id === d.tx); if (t) txForm(t); return; }
  if (d.clearf !== undefined) { ui.accFilter = null; return render(); }
  if (d.st) { ui.statsType = d.st; ui.open.clear(); return render(); }
  if (d.open) { ui.open.has(d.open) ? ui.open.delete(d.open) : ui.open.add(d.open); return render(); }
  if (d.acc) { ui.accFilter = d.acc; return go('inicio'); }
  if (d.newacc !== undefined) return accForm();
  if (d.newcat !== undefined) return catForm();
  if (d.close !== undefined) return closeSheet();
  if (el.id === 'copyjson') { const txt = JSON.stringify(S);
    navigator.clipboard.writeText(txt).then(() => toast('Respaldo copiado'), () => { $('#impmsg').textContent = 'Tu navegador no dejó copiar. Intenta de nuevo desde Safari o Chrome.'; }); return; }
  if (el.id === 'reset') { if (!ui.resetArm) { ui.resetArm = true; return render(); }
    try { localStorage.removeItem(KEY); } catch(_){} S = makeDemo(); ui = { ...ui, resetArm:false, offset:0, accFilter:null }; go('inicio'); return toast('Datos borrados'); }
  if (d.k && d.k.startsWith('rv') && (d.gp || d.gsel || d.gs || d.gopen) && SM && SM.items) { const it = SM.items[+d.k.slice(2)]; if (!it) return;
    const c = cat(it.categoryId), st = { parent:c ? (c.parentId || c.id) : null, sub:c && c.parentId ? c.id : null, open:!!it._open || !it.categoryId, expand:it._expand };
    gridTap(st, d); it.categoryId = st.sub || st.parent || it.categoryId; it._open = st.open; it._expand = st.expand; if (it.err === 'Elige una categoría.' && it.categoryId) it.err = ''; return drawReview(); }
  if (!F) return;
  if (d.ft) { syncForm(); if (F.type !== d.ft) { F.type = d.ft; F.parent = null; F.sub = null; F.catOpen = true; F.expand = null; if (d.ft !== 'ajuste') F.amount = Math.abs(F.amount); } return drawForm(); }
  if (d.k === 'f' && (d.gp || d.gsel || d.gs || d.gopen)) { syncForm(); const st = { parent:F.parent, sub:F.sub, open:F.catOpen || !F.parent, expand:F.expand }; gridTap(st, d);
    F.parent = st.parent; F.sub = st.sub; F.catOpen = st.open; F.expand = st.expand; return drawForm(); }

  if (d.fa) { syncForm(); F[d.fa] = d.id; return drawForm(); }
  if (d.sign) { syncForm(); F.amount = Math.abs(F.amount) * Number(d.sign); return drawForm(); }
  if (el.id === 'f-del') { if (!ui.delArm) { ui.delArm = true; el.className = 'btn block danger'; el.textContent = 'Toca otra vez para eliminar'; return; }
    S.transactions = S.transactions.filter(x => x.id !== F.id); save(); closeSheet(); render(); return toast('Movimiento eliminado'); }
});
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-amt' || t.dataset.bud !== undefined || t.id === 'a-bal') {
    const v = parseInt(t.value.replace(/\D/g, ''), 10);
    t.value = v ? nf.format(v) : '';
    if (t.id === 'f-amt') $('#f-err').textContent = '';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mmfile' && t.files[0]) importMM(t.files[0]);
  if (t.id === 'jsonfile' && t.files[0]) importJSON(t.files[0]);
  if (t.id === 'sday') { S.settings.startDay = Number(t.value); save(); ui.offset = 0; render(); toast('Periodo actualizado'); }
  if (t.dataset.bud !== undefined) { const v = parseInt(t.value.replace(/\D/g, ''), 10) || 0; if (v) S.budgets[t.dataset.bud] = v; else delete S.budgets[t.dataset.bud]; save(); toast('Presupuesto guardado'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'txf') return submitForm();
  if (e.target.id === 'accf') {
    const name = $('#a-name').value.trim(), group = $('#a-group').value.trim() || 'Otros';
    if (!name) { $('#a-err').textContent = 'Escribe el nombre de la cuenta.'; return; }
    const id = uid(); S.accounts.push({ id, name, group, order:S.accounts.length + 1, hidden:false });
    const bal = parseInt($('#a-bal').value.replace(/\D/g, ''), 10) || 0;
    if (bal) S.transactions.push({ id:uid(), type:'ajuste', amount:bal, date:iso(new Date()), ts:Date.now(), accountId:id, note:'Saldo inicial' });
    sortTx(S); save(); closeSheet(); render(); toast('Cuenta creada');
  }
  if (e.target.id === 'catf') {
    const name = $('#c-name').value.trim(), emoji = $('#c-emoji').value.trim(), par = $('#c-parent').value;
    if (!name) { $('#c-err').textContent = 'Escribe el nombre de la categoría.'; return; }
    const parent = par && par !== '__inc' ? cat(par) : null;
    S.categories.push({ id:uid(), name, emoji: emoji || (parent ? parent.emoji : '•'), type: parent ? parent.type : par === '__inc' ? 'ingreso' : 'gasto', parentId: parent ? parent.id : null, order:999, hidden:false });
    save(); closeSheet(); render(); toast('Categoría creada');
  }
});

render();
</script>
