}

/* ----- 5. cierre del periodo ----- */
let CIE = null;
async function cierreRun(){
  const p = period(-1), pl = planFor(p);
  aiLoading('Cierre del periodo', 'Armando el cierre del ' + fmtShort(p.start) + ' al ' + fmtShort(p.end) + '…');
  const ps = [p, period(-2), period(-3)];
  const L = ['Periodo que cerró: ' + p.s + ' a ' + p.e + '. Hoy: ' + iso(new Date()) + '.'];
  for (const q of ps) { let inc = 0, exp = 0; for (const t of S.transactions) if (inP(t, q)) { if (t.type === 'ingreso') inc += t.amount; else if (t.type === 'gasto') exp += t.amount; }
    L.push('- ' + q.s + ' a ' + q.e + ': ingresos ' + COP(inc) + ', gastos ' + COP(exp) + ', balance ' + COP(inc - exp)); }
  if (pl) {
    const R = planReal(pl, p);
    L.push('\nPlan "' + (pl.name || 'Plan') + '": ingreso planeado ' + COP(pl.income) + ', entró ' + COP(R.inc) + '. Rubros (id | nombre | tipo | plan | real en el periodo que cerró, -1, -2):');
    for (const i of pl.items) L.push('- ' + i.id + ' | ' + i.name + ' | ' + (isGastoItem(i) ? 'gasto ' + i.cls : 'ahorro') + ((i.every || 1) > 1 ? ' (se paga ' + everyTxt(i.every) + ')' : '') + ' | ' + COP(i.amount) + ' | ' + ps.map(q => COP(itemSpentIn(pl, i, q))).join(' | '));
    L.push('- Gastos fuera del plan en el periodo que cerró: ' + COP(R.out) + (R.fromSaved ? '; pagado con ahorros: ' + COP(R.fromSaved) : '') + '. Por categoría: ' + Object.entries(R.outCats).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) => (k === '_' ? 'Sin categoría' : (cat(k) || {}).name) + ' ' + COP(v)).join(', '));
  }
  const top = {}; for (const t of S.transactions) if (t.type === 'gasto' && inP(t, p)) { const k = (t.note || catPath(t.categoryId)).slice(0, 40); top[k] = (top[k] || 0) + t.amount; }
  L.push('\nMayores conceptos del periodo: ' + Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 12).map(([k, v]) => k + ' ' + COP(v)).join('; '));
  const prompt = 'Eres el analista financiero personal de ' + userName() + ', en Bogotá. Escribe el cierre del periodo que acaba de terminar, en español de Colombia, directo y cálido, sin la raya larga. Cifras como $1.234.567.\n' +
    'texto (markdown corto, máximo 12 líneas): **Cómo te fue** con 2 o 3 frases y cifras (ingresos, gastos, balance, frente al plan); **Lo que se salió** en viñetas "- "; **Lo que salió bien** en viñetas.\n' +
    'ajustes: propuestas para el plan del periodo siguiente, solo con razón clara en los 3 periodos (rubro que se pasa o se queda corto 2 de 3 veces). Máximo 4, montos redondeados a miles. itemId de la lista de rubros. Si no hay plan o nada que ajustar, lista vacía.\n' +
    'Usa solo estos datos:\n' + perfilBlock() + '\n' + L.join('\n') +
    '\n\nResponde SOLO con JSON: {"texto":"","ajustes":[{"itemId":"","nuevo":0,"razon":""}]}';
  try {
    const r = await iaCall(prompt, true, null, 'ask');
    CIE = { p, texto:r.texto || '', ajustes:(r.ajustes || []).map(a => ({ ...a, nuevo:Math.round(+a.nuevo || 0), item:pl && pl.items.find(i => i.id === a.itemId) })).filter(a => a.item && a.nuevo > 0 && a.nuevo !== a.item.amount) };
    lsSet('cierre', p.s); render(); cierreDraw();
  } catch (e) { openSheet('<div class="sheet-h"><b id="sheet-title">Cierre del periodo</b><button class="x" data-close aria-label="Cerrar">✕</button></div><div class="form"><div class="err">' + esc(aiErr(e)) + '</div><button class="btn block" data-cierre>Intentar de nuevo</button></div>'); }
}
function cierreDraw(){

/* aplica el ajuste en la versión del plan vigente desde este periodo (la crea si hace falta) */
function cierreApply(i){
  const a = CIE.ajustes[i]; if (!a || a.done) return;
  const p0 = period(0); let pl = planFor(p0); if (!pl) return;
  if (pl.start < p0.s) {
    const old = pl; pl = JSON.parse(JSON.stringify(old)); pl.id = uid(); pl.start = p0.s; pl.name = 'Plan ' + MESL[p0.start.getMonth()] + ' ' + p0.start.getFullYear();
    const map = {}; pl.items.forEach(it => { const n = uid(); map[it.id] = n; it.id = n; });
    S.plans.push(pl); CIE.ajustes.forEach(x => { if (map[x.item.id]) x.itemNew = map[x.item.id]; });
  }

/* ---------- Tarjeta de crédito: las compras quedan en la tarjeta y se pagan desde un bolsillo ---------- */
const isCard = a => !!(a && a.card && a.card.pocket);

const cardPocket = a => (a && a.card && accById(a.card.pocket)) ? a.card.pocket : null;
const pendingMoves = () => S.transactions.filter(t => t.type === 'transferencia' && t.pending);
function nextDay(day){ // próxima fecha (hoy incluido) con ese día del mes
  const t = new Date(); t.setHours(12, 0, 0, 0);
  let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, daysInMonth(t.getFullYear(), t.getMonth())), 12);
  if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, Math.min(day, daysInMonth(t.getFullYear(), t.getMonth() + 1)), 12);
  return d;
}

/* gasto con tarjeta pagado desde otro bolsillo: deja pendiente el traslado de ese bolsillo al de la tarjeta */
function syncFund(t){
  const ex = S.transactions.find(x => x.type === 'transferencia' && x.auto === t.id);
  const card = t.type === 'gasto' ? cardOf(t.accountId) : null, pk = cardPocket(card);
  const need = card && pk && t.fund && t.fund !== pk && accById(t.fund);
  if (!need) { if (t.fund && (!card || t.fund === pk)) delete t.fund; if (ex && ex.pending) S.transactions = S.transactions.filter(x => x !== ex); return; }
  const note = 'Para la tarjeta: ' + (t.note || catPath(t.categoryId));
  if (ex) { if (ex.pending) Object.assign(ex, { amount:t.amount, accountId:t.fund, toAccountId:pk, note }); return; }
  S.transactions.push({ id:uid(), type:'transferencia', amount:t.amount, date:t.date, ts:Date.now(), accountId:t.fund, toAccountId:pk, note, src:'tarjeta', auto:t.id, pending:true });
}

  const thumbs = FS.files.map((f, i) => '<span class="thumb"><img alt="Captura ' + (i + 1) + '" src="' + (f._url || (f._url = URL.createObjectURL(f))) + '"><button data-fsrm="' + i + '" aria-label="Quitar">✕</button></span>').join('');
  let h = '<div class="sheet-h"><b id="sheet-title">Cuadrar con una captura</b><button class="x" data-close aria-label="Cerrar">✕</button></div><div class="form fs">';
  if (!FS.res) h += '<p class="insight" style="margin-top:-6px">Toma captura de la pantalla de Lulo donde se ven tus bolsillos, y otra de la tarjeta. La IA lee los saldos y los compara con Caudal.</p>' +
    (thumbs ? '<div class="thumbs">' + thumbs + '</div>' : '') +
    '<div class="two"><label class="btn ghost" style="cursor:pointer">' + (FS.files.length ? 'Agregar otra' : 'Subir capturas') + '<input type="file" id="fs-files" accept="image/*" multiple hidden></label>' +
    '<button class="btn accent" type="button" data-fsgo' + (FS.busy || !FS.files.length ? ' disabled' : '') + '>' + (FS.busy ? 'Leyendo…' : 'Comparar') + '</button></div>';
  h += '<div class="err">' + esc(msg || '') + '</div>';
  if (FS.res) {
    const rows = FS.res, ok = rows.filter(r => !r.diff && !r.done), bad = rows.filter(r => r.diff && !r.done);
    h += '<section class="card" style="padding:12px 16px">' + rows.map((r, i) => '<div class="set"><div class="t"><b>' + esc(r.a.name) + '</b><span>Caudal ' + money(r.cau) + ' · banco ' + money(r.real) + '</span></div>' +
      (r.done ? '<span class="pos">Listo ✓</span>' : !r.diff ? '<span class="pos">Cuadra ✓</span>' : '<span style="display:flex;gap:6px;align-items:center"><b class="num ' + (r.diff < 0 ? 'neg' : 'pos') + '">' + money(r.diff, true) + '</b><button class="btn sm" type="button" data-fsadj="' + i + '">Ajustar</button></span>') + '</div>').join('') + '</section>';
    if (FS.missing && FS.missing.length) h += '<p class="note" style="padding:0">No encontré en la captura: ' + esc(FS.missing.join(', ')) + '.</p>';
    if (bad.length) h += '<button class="btn accent block" type="button" data-fsall>Ajustar las ' + bad.length + ' diferencias y marcar todo cuadrado</button><p class="note" style="padding:0">Diferencias pequeñas en bolsillos suelen ser rendimientos. Si una es grande, mejor revisa esa cuenta antes (tócala en Cuentas).</p>';
    else if (ok.length) h += '<button class="btn accent block" type="button" data-fsall>Marcar todo como cuadrado</button>';
  }

}
async function fsRun(){
  const accs = S.accounts.filter(a => !a.hidden);
  const prompt = 'Lee los saldos de las cuentas, bolsillos y tarjetas de crédito que aparecen en estas capturas de una app bancaria colombiana.\n' +
    '- Relaciona cada saldo con una cuenta de la lista por su nombre (los bolsillos suelen verse con el nombre corto y un emoji, por ejemplo "GTC" o "Moto 🛵").\n' +
    '- En tarjetas de crédito usa la "deuda actual" como saldo NEGATIVO; ignora cupo disponible y pago mínimo.\n' +
    '- La app usa coma para miles y punto para decimales ($1,668,855.87 = 1668856). Redondea al peso.\n' +
    '- Solo cuentas que veas con su saldo; no inventes.\n\nCuentas (id | nombre | grupo):\n' + accs.map(a => a.id + ' | ' + a.name + ' | ' + a.group).join('\n') +
    '\n\nResponde SOLO con JSON: {"saldos":[{"accountId":"","saldo":0}]}';
  FS.busy = true; fsDraw();
  try {
    const r = await iaCall(prompt, true, await Promise.all(FS.files.map(shrink))), bal = balances(), seen = new Set();
    FS.res = (r.saldos || []).filter(x => accById(x.accountId) && !seen.has(x.accountId) && seen.add(x.accountId)).map(x => {
      const cau = bal[x.accountId] || 0, real = Math.round(+x.saldo || 0); return { a:accById(x.accountId), cau, real, diff:real - cau };
    });
    FS.missing = [];
    if (!FS.res.length) { FS.res = null; FS.busy = false; return fsDraw('No pude leer saldos en esas capturas. Prueba con la pantalla donde se ven los bolsillos.'); }
  } catch (e) { FS.busy = false; return fsDraw(aiErr(e)); }
  FS.busy = false; fsDraw();
}
function fsMark(r){

  r.done = true;
}

  if (d.movedone) { e.stopPropagation(); const t = S.transactions.find(x => x.id === d.movedone); if (t) { delete t.pending; t.date = iso(new Date()); t.ts = Date.now(); sortTx(S); save(); render(); toast('Traslado registrado'); } return; }

    txForm(null); F.type = 'transferencia'; F.accountId = pk; F.toAccountId = a.id; F.amount = debt; F.note = 'Pago tarjeta'; return drawForm(); }

/* calcula los avisos de los próximos días y los deja en la cola del servidor */
function avItems(){
  const out = [], now = Date.now();
  const at = (d, h, m) => { const x = new Date(d); x.setHours(h, m || 0, 0, 0); return x; };
  const add = (kind, when, title, body) => { if (when.getTime() > now + 60000) out.push({ id:kind + '-' + iso(when) + '-' + avHash(title), at:when.toISOString(), kind, title, body }); };
  const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
  if (avOn('recibos')) for (const b of (S.bills || []).filter(b => b.active !== false)) {
    const c = billCycle(b); if (c.cy.paid) continue;
    add('recibos', at(c.pay, 9), 'Hoy toca pagar ' + b.name, (c.amount ? 'Cerca de ' + money(c.amount) + '. ' : '') + 'Vence el ' + c.due.getDate() + ' de ' + MESL[c.due.getMonth()] + '.');
    if (iso(c.due) !== iso(c.pay)) add('recibos', at(c.due, 9), 'Vence hoy: ' + b.name, 'Si ya lo pagaste, márcalo en Caudal.');
  }
  if (avOn('tarjeta')) for (const a of S.accounts.filter(a => isCard(a) && !a.hidden && a.card.due)) {
    const B = balances(), debt = Math.max(0, -(B[a.id] || 0)), pk = cardPocket(a), have = B[pk] || 0, due = nextDay(a.card.due);
    if (debt > 0) {
      const left = have - debt, extra = left >= 0 ? 'Te sobran ' + money(left) + '.' : 'Te faltan ' + money(-left) + '.';
      const pre = new Date(due); pre.setDate(pre.getDate() - 2);
      add('tarjeta', at(pre, 9), 'Pagas la tarjeta el ' + due.getDate() + ' de ' + MESL[due.getMonth()], 'Debes ' + money(debt) + ' y en ' + accShort(pk) + ' tienes ' + money(have) + '. ' + extra);
      add('tarjeta', at(due, 8), 'Hoy pagas la tarjeta', 'Debes ' + money(debt) + '. Al pagar, regístralo con "Pagar tarjeta".');
    }
  }
  if (avOn('diario')) { const hr = +(avPrefs().hora || 20); for (let n = 0; n < 7; n++) add('diario', at(day(n), hr), 'Repaso del día', 'Mira lo que registraste hoy.'); }
  if (avOn('mover')) {
    const mv = pendingMoves(), pend = S.transactions.filter(t => t.pending && t.type !== 'transferencia');
    if (mv.length) add('mover', at(day(1), 19), 'Tienes ' + (mv.length === 1 ? 'un traslado' : mv.length + ' traslados') + ' por mover', mv.slice(0, 2).map(t => money(t.amount) + ' de ' + accShort(t.accountId) + ' a ' + accShort(t.toAccountId)).join(' · '));
    if (pend.length) add('mover', at(day(1), 12, 30), (pend.length === 1 ? 'Un valor' : pend.length + ' valores') + ' por confirmar', 'Corrígelos con lo que dice el banco para que tus cuentas cuadren.');
  }
  if (avOn('cierre')) { const p1 = period(1); add('cierre', at(p1.start, 9), 'Cerró tu periodo', 'Mira cómo te fue y qué ajustar del plan.'); }
  return out;
}
let avT = null, avLast = '';
function avSchedule(now){
  clearTimeout(avT);
  return new Promise(res => { avT = setTimeout(async () => {
    if (!AV.on || !sb || !session || S.demo) return res();
    const items = avItems(), sig = JSON.stringify(items);
    if (sig === avLast && !now) return res();
    try {
      if (items.length) await sb.from('push_queue').upsert(items.map(x => ({ ...x, user_id:session.user.id })), { onConflict:'user_id,id' });
      let q = sb.from('push_queue').delete().is('sent_at', null).gt('at', new Date().toISOString()).neq('kind', 'prueba');
      if (items.length) q = q.not('id', 'in', '(' + items.map(x => x.id).join(',') + ')');
      await q; avLast = sig;
    } catch (_) {}
    res();
  }, now ? 0 : 2500); });
}

async function pull(){

  const res = await Promise.all(T.map(fetchAll)); T.forEach((t, i) => R[t] = res[i]);
  const empty = !R.settings.length && !R.accounts.length && !R.transactions.length;
  const remote = empty ? null : fromRows(R);
  lastSnap = remote ? snapshot(remote) : emptySnap();
  let pending = false; try { pending = localStorage.getItem(PEND) === '1'; } catch (_) {}
  if (remote && !pending) { S = remote; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} }
  else if (remote && pending && S.demo) { S = remote; }
  else if (remote && pending && !(S.plans || []).length && remote.plans.length) { S.plans = remote.plans; }
  S.inbox = S.inbox || []; S.bills = S.bills || []; S.recurring = S.recurring || []; S.cardMap = S.cardMap || {};
  runRecurring();
  if (S.demo && !remote) setSync('vacio'); else { if (!remote || pending) await pushNow(); else setSync('ok'); }
  render();
  if (typeof autoInbox === 'function') setTimeout(autoInbox, 350);
}
function emptySnap(){ const m = {}; ['settings','accounts','categories','transactions','budgets','bills','recurring','inbox','plans'].forEach(t => m[t] = new Map()); return m; }
const PK = { settings:null, budgets:'category_id' };
async function pushNow(){
  if (!sb || !session || !lastSnap || S.demo) return;
  if (syncing) { scheduleSync(1500); return; }
  syncing = true; setSync('subiendo');
  const snap = snapshot(S), uidv = session.user.id;
  try {
    for (const t of Object.keys(snap)) {
      const cur = snap[t], old = lastSnap[t] || new Map(), up = [], del = [];
      for (const [k, v] of cur) if (old.get(k) !== v) up.push({ ...JSON.parse(v), user_id:uidv });
      for (const k of old.keys()) if (!cur.has(k)) del.push(k);
      const conflict = t === 'settings' ? 'user_id' : t === 'budgets' ? 'user_id,category_id' : 'user_id,id';
      for (let i = 0; i < up.length; i += 500) { const { error } = await sb.from(t).upsert(up.slice(i, i + 500), { onConflict:conflict }); if (error) throw error; }
      const col = PK[t] || 'id';
      for (let i = 0; i < del.length; i += 200) { if (t === 'settings') break; const { error } = await sb.from(t).delete().eq('user_id', uidv).in(col, del.slice(i, i + 200)); if (error) throw error; }
    }
    lastSnap = snap; try { localStorage.removeItem(PEND); } catch (_) {}
    syncedAt = Date.now(); setSync('ok');
  } catch (e) { setSync(navigator.onLine === false ? 'offline' : 'error', e && e.message); scheduleSync(30000); }
  finally { syncing = false; }
}
function scheduleSync(ms){ clearTimeout(syncT); syncT = setTimeout(pushNow, ms || 900); }

async function blobToB64(b){ const buf = new Uint8Array(await b.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); return { mime:b.type || 'image/jpeg', data:btoa(s) }; }
async function iaCall(prompt, json, images, task){
  const imgs = images && images.length ? await Promise.all(images.map(blobToB64)) : [];
  const { data, error } = await sb.functions.invoke('ia', { body:{ prompt, json:!!json, images:imgs, task:task || 'registro' } });
  if (error) { let b = null; try { b = await error.context.json(); } catch (_) {}
    throw { code:(b && b.code) || 'upstream_error', message:(b && b.error) || error.message, text:b && b.code !== 'rate_limited' && b.code !== 'not_granted' ? b.error : '' }; }
  if (data && data.error) throw { code:data.code || 'upstream_error', message:data.error, text:data.error };
  if (!json) { if (!String(data.text || '').trim()) throw { code:'upstream_error', text:'La IA no alcanzó a responder. Intenta de nuevo.' }; return data.text; }
  try { return JSON.parse(data.text); } catch (_) { const m = String(data.text || '').match(/\{[\s\S]*\}|\[[\s\S]*\]/); if (m) return JSON.parse(m[0]); throw { code:'invalid_json', text:data.text }; }
}

/* selector de categoría estilo cuadrícula: la principal abre sus subcategorías debajo de su fila.

function gridPicker(type, parent, sub, open, expand, k){
  const at = (n, v) => 'data-' + n + '="' + esc(v) + '" data-k="' + k + '"';
  const pc = parent ? cat(parent) : null, sc = sub ? cat(sub) : null;
  if (pc && !open) return '<button type="button" class="csel" ' + at('gopen', '1') + '><span class="em">' + esc((sc && sc.emoji) || pc.emoji || '•') + '</span><b>' + esc(pc.name + (sc ? ' › ' + sc.name : '')) + '</b><span class="ch">Cambiar</span></button>';
  const parents = S.categories.filter(c => !c.parentId && c.type === type && (!c.hidden || c.id === parent));
  const subsOf = id => S.categories.filter(c => c.parentId === id && (!c.hidden || c.id === sub));
  const tile = (c, attrs, pressed, extra, chev) => '<button type="button" class="ctile" ' + attrs + ' aria-pressed="' + pressed + '"' + (extra || '') + '><span class="em">' + esc(c.emoji || '•') + '</span><span class="nm">' + esc(c.name) + '</span>' + (chev ? '<span class="chev">' + (expand === c.id ? '▲' : '▼') + '</span>' : '') + '</button>';
  const ix = parents.findIndex(c => c.id === expand), end = ix < 0 ? -1 : Math.min(parents.length - 1, ix - ix % 3 + 2);
  let h = '<div class="cgrid">';
  parents.forEach((c, i) => { const hs = subsOf(c.id).length > 0;
    h += tile(c, at('gp', c.id), parent === c.id && !hs, hs ? ' aria-expanded="' + (expand === c.id) + '"' : '', hs);
    if (i === end) { const p0 = parents[ix];
      h += '<div class="csubs">' + tile({ emoji:p0.emoji, name:'Solo ' + p0.name }, at('gsel', p0.id), parent === p0.id && !sub) +
        subsOf(p0.id).map(s => tile(s, at('gs', s.id), sub === s.id)).join('') + '</div>'; }
  });
  return h + '</div>';
}

/* aplica un toque de la cuadrícula a un estado { parent, sub, open, expand } */
function gridTap(st, d){
  if (d.gp) { if (S.categories.some(c => c.parentId === d.gp && !c.hidden)) { st.expand = st.expand === d.gp ? null : d.gp; return; } st.parent = d.gp; st.sub = null; st.open = false; st.expand = null; return; }
  if (d.gsel) { st.parent = d.gsel; st.sub = null; st.open = false; st.expand = null; return; }
  if (d.gs) { st.sub = d.gs; st.parent = (cat(d.gs) || {}).parentId || st.parent; st.open = false; st.expand = null; return; }
  if (d.gopen) { st.open = true; st.expand = st.parent; }
}
/* gasto dividido: la parte principal es la de arriba (categoría y cuenta elegidas) y se queda con lo que
   no asignes a las demás partes. Cada parte se guarda como un movimiento propio con el mismo grp. */
const partsSum = () => (F.parts || []).reduce((a, p) => a + (p.amount || 0), 0);
function splitMainTxt(){
  const c = cat(F.sub || F.parent), rest = Math.abs(F.amount) - partsSum();
  return '<span>' + esc((c ? c.name : 'Sin categoría') + ' · ' + (F.accountId ? accShort(F.accountId) : 'sin cuenta')) + '</span><b class="' + (rest < 0 ? 'neg' : '') + '">' + (rest < 0 ? 'Te pasaste ' + money(-rest) : money(rest)) + '</b>';
}
/* división simple (dos partes): misma cuenta y dos categorías, o misma categoría y dos cuentas.
   F.pct es el porcentaje de la segunda parte; la primera se queda con el resto. */
function syncSplit(){
  if (!F || !F.splitMode || F.splitMode === 'multi' || !(F.parts || []).length) return;
  const q = F.parts[0]; q.amount = Math.round(Math.abs(F.amount) * (F.pct || 50) / 100);
  if (F.splitMode === 'cat') q.acc = F.accountId; else q.cat = F.sub || F.parent || '';
}
function splitNames(){
  const q = F.parts[0], nm = id => { const c = cat(id); return c ? c.name : '?'; };
  return F.splitMode === 'cat' ? [nm(F.sub || F.parent), q.cat ? nm(q.cat) : 'Segunda categoría'] : [F.accountId ? accShort(F.accountId) : '?', q.acc ? accShort(q.acc) : 'Otra cuenta'];
}
function splitBarTxt(){
  syncSplit(); const [a, b] = splitNames(), pct = F.pct || 50, tot = Math.abs(F.amount), q = F.parts[0];
  return '<div class="xl"><b>' + esc(a) + ' ' + (100 - pct) + '%</b><b>' + pct + '% ' + esc(b) + '</b></div><div class="xl"><span>' + (tot ? money(tot - q.amount) : '$ 0') + '</span><span>' + (tot ? money(q.amount) : '$ 0') + '</span></div>';
}
function splitBar(){
  return '<div class="xbar"><div id="xbtxt">' + splitBarTxt() + '</div><input type="range" min="10" max="90" step="10" value="' + (100 - (F.pct || 50)) + '" data-xrange aria-label="Reparto entre las dos partes"><button type="button" class="xmore" data-xmulti>Más partes o valores exactos</button></div>';
}
function accChips2(){
  const q = F.parts[0], accs = S.accounts.filter(a => !a.hidden || a.id === F.accountId || a.id === q.acc);
  return '<div class="cgrid">' + accs.map(a => '<button type="button" class="ctile sm" data-xacc2="' + esc(a.id) + '" aria-pressed="' + (F.accountId === a.id || q.acc === a.id) + '"><span class="nm">' + esc(accShort(a.id)) + '</span></button>').join('') + '</div>';
}
function splitField(){
  if (!(F.parts || []).length) return '';
  const accOpts = sel => S.accounts.filter(a => !a.hidden || a.id === sel).map(a => '<option value="' + esc(a.id) + '"' + (sel === a.id ? ' selected' : '') + '>' + esc(accShort(a.id)) + '</option>').join('');
  return '<div class="field split"><span class="label">Dividido en</span><div class="smain" id="f-rest">' + splitMainTxt() + '</div>' +
    F.parts.map((p, i) => { const c = cat(p.cat);
      return '<div class="prow"><div class="pcat">' + gridPicker('gasto', c ? (c.parentId || c.id) : null, c && c.parentId ? c.id : null, !!p._open || !p.cat, p._expand || null, 'x' + i) + '</div>' +
      '<select data-xacc="' + i + '" aria-label="Cuenta de la parte ' + (i + 2) + '">' + accOpts(p.acc) + '</select><input class="num" inputmode="numeric" autocomplete="off" placeholder="$ 0" data-xamt="' + i + '" value="' + (p.amount ? nf.format(p.amount) : '') + '" aria-label="Valor de la parte ' + (i + 2) + '">' +
      '<button type="button" class="pdel" data-xdel="' + i + '">Quitar</button>' +
      '<div class="ppct" role="group" aria-label="Porcentaje del total">' + [10, 20, 30, 40, 50, 60, 70, 80, 90].map(n => '<button type="button" data-xpct="' + i + ':' + n + '" aria-pressed="' + (p.pct === n) + '">' + n + '%</button>').join('') + '</div></div>'; }).join('') +
    '<button type="button" class="pill" data-xadd style="align-self:flex-start">+ Otra parte</button></div>';
}
function readAmt(){ return parseInt(($('#f-amt').value || '').replace(/\D/g, ''), 10) || 0; }
function syncForm(){ const a = $('#f-amt'); if (!a) return; const v = readAmt(); F.amount = F.type === 'ajuste' && F.amount < 0 ? -v : v; F.date = $('#f-date').value || F.date; F.note = $('#f-note').value; }
function submitForm(){
  syncForm();
  const err = m => { $('#f-err').textContent = m; };
  if (!F.amount) return err('Escribe el valor.');
  if ((F.type === 'gasto' || F.type === 'ingreso') && !F.parent) return err('Elige una categoría.');
  if (!F.accountId) return err('Elige una cuenta.');
  if (F.type === 'transferencia' && (!F.toAccountId || F.toAccountId === F.accountId)) return err('Elige una cuenta de destino distinta.');
  if (F.type === 'gasto' && F.splitMode === 'cat' && !(F.parts[0] || {}).cat) return err('Elige la segunda categoría o toca No dividir.');
  if (F.type === 'gasto' && F.splitMode === 'acc' && !(F.parts[0] || {}).acc) return err('Elige la segunda cuenta o toca No dividir.');
  if (F.type === 'gasto' && F.splitMode === 'cat' && (F.parts[0].cat === (F.sub || F.parent))) return err('Elige dos categorías distintas.');
  syncSplit();
  const parts = F.type === 'gasto' ? (F.parts || []) : [];
  if (parts.length) {
    if (parts.some(p => !p.amount)) return err('Escribe el valor de cada parte o quítala.');
    if (parts.some(p => !p.cat)) return err('Elige la categoría de cada parte.');
    if (Math.abs(F.amount) - partsSum() <= 0) return err('Las partes suman todo el gasto: deja algo para ' + ((cat(F.sub || F.parent) || {}).name || 'la categoría de arriba') + ' o quita una parte.');
  }
  const t = { id: F.id || uid(), type:F.type, amount: F.type === 'ajuste' ? F.amount : Math.abs(F.amount), date:F.date, ts:Date.now(), accountId:F.accountId, note:F.note.trim() };
  if (F.type === 'gasto' || F.type === 'ingreso') t.categoryId = F.sub || F.parent;
  if (F.type === 'transferencia') t.toAccountId = F.toAccountId;
  if (F.pending && (F.type === 'gasto' || F.type === 'ingreso')) t.pending = true;
  if (F.type === 'gasto' && F.fund && cardOf(F.accountId)) t.fund = F.fund;
  const grp = parts.length ? (F.grp || uid()) : null;
  if (grp) { t.grp = grp; t.amount = Math.abs(F.amount) - partsSum(); }
  if (!F.id && !F.dupOk && S.transactions.some(x => x.type === t.type && x.amount === t.amount && x.date === t.date && x.accountId === t.accountId)) {
    F.dupOk = true; return err('Ya tienes un movimiento igual ese día en esta cuenta. Si es otro distinto, toca Guardar otra vez.'); }
  const i = S.transactions.findIndex(x => x.id === t.id);
  if (i >= 0) { const o = S.transactions[i]; t.ts = o.ts || t.ts; if (o.src) t.src = o.src; if (o.auto) t.auto = o.auto; if (o.pending && t.type === 'transferencia') t.pending = true; S.transactions[i] = t; } else S.transactions.push(t);
  syncFund(t);
  if (grp || F.grp) { /* partes del gasto dividido: crea, actualiza y borra las que quitaste */
    const keep = new Set([t.id]);
    for (const p of parts) { const x = { id:p.id || uid(), type:'gasto', amount:p.amount, date:t.date, ts:t.ts, accountId:p.acc, categoryId:p.cat, note:t.note, grp };
      if (t.pending) x.pending = true; keep.add(x.id);
      const j = S.transactions.findIndex(y => y.id === x.id); if (j >= 0) S.transactions[j] = x; else S.transactions.push(x); syncFund(x); }
    const gone = new Set(S.transactions.filter(y => F.grp && y.grp === F.grp && !keep.has(y.id)).map(y => y.id));
    S.transactions = S.transactions.filter(y => !gone.has(y.id) && !(gone.has(y.auto) && y.pending && y.type === 'transferencia'));
  }
  S.lastAccount = F.accountId; sortTx(S); save();
  const wasEdit = !!F.id, ret = CQ_RET; closeSheet();
  if (ret) { render(); setTimeout(ret, 300); return toast(wasEdit ? 'Cambios guardados' : 'Registrado'); }
  const p = period(ui.offset); if (!inP(t, p)) { for (let o = -24; o <= 1; o++) { if (inP(t, period(o))) { ui.offset = o; break; } } }
  render(); { const bm = budgetMsg(t); toast(bm || (wasEdit ? 'Cambios guardados' : 'Registrado'), bm ? 3400 : 2000); }
}

/* ---------- importación ---------- */
let sqlReady = null;
function loadSql(){
  if (sqlReady) return sqlReady;
  const srcs = ['https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-asm.js', 'https://unpkg.com/sql.js@1.10.3/dist/sql-asm.js'];
  sqlReady = new Promise((res, rej) => {
    const tryLoad = i => { if (i >= srcs.length) return rej(new Error('No se pudo cargar el lector de respaldos.'));
      const s = document.createElement('script'); s.src = srcs[i]; s.onload = () => window.initSqlJs().then(res, rej); s.onerror = () => tryLoad(i + 1); document.head.appendChild(s); };
    tryLoad(0);
  });
  sqlReady.catch(() => { sqlReady = null; });
  return sqlReady;
}
async function importMM(file){
  const msg = $('#impmsg'); msg.textContent = 'Leyendo ' + file.name + '…';
  try {
    const SQL = await loadSql();
    const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
    const st = mmImport(db); db.close();
    if (!st.transactions.length && !st.accounts.length) throw new Error('El archivo no tiene movimientos.');
    const keep = S.demo ? {} : { bills:S.bills, recurring:S.recurring, cardMap:S.cardMap, plans:S.plans };
    const nm = S.settings && S.settings.name, rt = S.settings && S.settings.rate;
    S = st; S.plans = keep.plans || []; S.bills = keep.bills || []; S.recurring = keep.recurring || []; S.cardMap = keep.cardMap || {}; S.inbox = [];
    if (nm) S.settings.name = nm; if (rt) S.settings.rate = rt; save(); ui.offset = 0; ui.accFilter = null; ui.view = 'inicio'; render();
    toast(nf.format(st.transactions.length) + ' movimientos importados');
  } catch(e){ msg.textContent = 'No pude leer ese archivo. Verifica que sea el respaldo .mmbak de Money Manager. (' + e.message + ')'; }
}
async function importJSON(file){
  try { const s = normBackup(JSON.parse(await file.text())); if (!s.transactions || !s.accounts || !s.categories) throw new Error('formato');
    S = s; save(); ui.view = 'inicio'; ui.offset = 0; render(); toast('Respaldo restaurado'); }
  catch(e){ $('#impmsg').textContent = 'Ese archivo no es un respaldo de Caudal.'; }
}

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-amt' || t.dataset.bud !== undefined || t.id === 'a-bal') {
    const v = parseInt(t.value.replace(/\D/g, ''), 10);
    t.value = v ? nf.format(v) : '';
    if (t.id === 'f-amt') $('#f-err').textContent = '';
  }
  if (F && (t.id === 'f-amt' || t.dataset.xamt !== undefined)) {
    if (t.dataset.xamt !== undefined) { const v = parseInt(t.value.replace(/\D/g, ''), 10) || 0; t.value = v ? nf.format(v) : ''; F.parts[+t.dataset.xamt].amount = v; F.parts[+t.dataset.xamt].pct = null;
      t.closest('.prow').querySelectorAll('[data-xpct]').forEach(b => b.setAttribute('aria-pressed', 'false')); $('#f-err').textContent = ''; }
    if (t.id === 'f-amt') { F.amount = readAmt(); (F.parts || []).forEach((p, i) => { if (!p.pct) return; p.amount = Math.round(F.amount * p.pct / 100); const el = document.querySelector('[data-xamt="' + i + '"]'); if (el) el.value = p.amount ? nf.format(p.amount) : ''; }); }
    const r = $('#f-rest'); if (r) r.innerHTML = splitMainTxt();
    const xb = $('#xbtxt'); if (xb) xb.innerHTML = splitBarTxt();
    const fb = $('#f-bud'); if (fb && fb.dataset.left !== '') fb.innerHTML = fbudTxt(fb.dataset.name, +fb.dataset.left, Math.max(0, Math.abs(F.amount) - partsSum()));
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'mmfile' && t.files[0]) importMM(t.files[0]);
  if (t.id === 'jsonfile' && t.files[0]) importJSON(t.files[0]);
  if (F && t.dataset.xacc !== undefined) F.parts[+t.dataset.xacc].acc = t.value;
  if (t.id === 'sday') { S.settings.startDay = Number(t.value); save(); ui.offset = 0; render(); toast('Periodo actualizado'); }
  if (t.dataset.bud !== undefined) { const v = parseInt(t.value.replace(/\D/g, ''), 10) || 0; if (v) S.budgets[t.dataset.bud] = v; else delete S.budgets[t.dataset.bud]; save(); toast('Presupuesto guardado'); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'txf') return submitForm();
  if (e.target.id === 'accf') {
    const name = $('#a-name').value.trim(), group = $('#a-group').value.trim() || 'Otros';
    if (!name) { $('#a-err').textContent = 'Escribe el nombre de la cuenta.'; return; }
    const id = uid(); S.accounts.push({ id, name, group, order:S.accounts.length + 1, hidden:false });
    const bal = parseInt($('#a-bal').value.replace(/\D/g, ''), 10) || 0;
    if (bal) S.transactions.push({ id:uid(), type:'ajuste', amount:bal, date:iso(new Date()), ts:Date.now(), accountId:id, note:'Saldo inicial' });
    sortTx(S); save(); closeSheet(); render(); toast('Cuenta creada');
  }
  if (e.target.id === 'catf') {
    const name = $('#c-name').value.trim(), emoji = $('#c-emoji').value.trim(), par = $('#c-parent').value;
    if (!name) { $('#c-err').textContent = 'Escribe el nombre de la categoría.'; return; }
    const parent = par && par !== '__inc' ? cat(par) : null;
    S.categories.push({ id:uid(), name, emoji: emoji || (parent ? parent.emoji : '•'), type: parent ? parent.type : par === '__inc' ? 'ingreso' : 'gasto', parentId: parent ? parent.id : null, order:999, hidden:false });
    save(); closeSheet(); render(); toast('Categoría creada');
  }
});

render();
</script>

</body>
</html>
